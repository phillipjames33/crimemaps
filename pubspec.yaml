name: crime_maps
description: "Crime Maps — Real-time civic situational awareness, public camera transparency, and hyper-local indie music streaming."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI (Codegen Only)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation (StatefulShellRoute)
  go_router: ^14.8.1

  # Immutable Models & Serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Maps, Clustering & 3D WebView
  google_maps_flutter: ^2.10.1
  google_maps_cluster_manager_2: ^3.1.0
  webview_flutter: ^4.10.0

  # Geospatial, Location & Local Spatial Cache
  geoflutterfire_plus: ^0.0.32
  geolocator: ^13.0.2
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0

  # Persistent Indie Music Audio
  just_audio: ^0.9.46
  audio_service: ^0.18.17
  cached_network_image: ^3.4.1

  # Firebase Backend SDKs
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4
  firebase_app_check: ^0.3.2+4
  cloud_functions: ^5.3.4

  # Monetization & Ads
  purchases_flutter: ^9.0.0
  google_mobile_ads: ^5.3.1

  # Utilities
  http: ^1.3.0
  intl: ^0.20.2
  uuid: ^4.5.1
  file_picker: ^9.0.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  freezed: ^3.0.6
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  assets:
    - assets/map_styles/
    - assets/web/
