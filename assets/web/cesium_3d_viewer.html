<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Crime Maps 3D Inspection</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0b0f17;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #hud {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: rgba(11, 15, 23, 0.85);
      color: #e2e8f0;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 12px;
      padding: 12px 14px;
      z-index: 10;
      font-size: 13px;
    }
    #hudTitle { font-weight: 700; color: #38bdf8; margin-bottom: 4px; }
    #hudStatus { color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="hud">
    <div id="hudTitle">3D Photorealistic Inspection</div>
    <div id="hudStatus">Initializing 3D flyover...</div>
  </div>
  <script>
    async function initCrimeMaps3D(lat, lng, label, googleMapsApiKey) {
      const titleEl = document.getElementById('hudTitle');
      const statusEl = document.getElementById('hudStatus');
      titleEl.textContent = label || 'Incident 3D Inspection';

      try {
        if (typeof Cesium === 'undefined') {
          statusEl.textContent = 'Offline preview mode (' + lat.toFixed(5) + ', ' + lng.toFixed(5) + ')';
          return;
        }
        const viewer = new Cesium.Viewer('cesiumContainer', {
          animation: false,
          timeline: false,
          geocoder: false,
          homeButton: false,
          sceneModePicker: false,
          baseLayerPicker: false,
          navigationHelpButton: false,
          fullscreenButton: false,
          infoBox: false,
          selectionIndicator: false,
          globe: googleMapsApiKey ? false : undefined,
        });

        if (googleMapsApiKey && googleMapsApiKey.length > 10) {
          const tileset = await Cesium.Cesium3DTileset.fromUrl(
            'https://tile.googleapis.com/v1/3dtiles/root.json?key=' + encodeURIComponent(googleMapsApiKey)
          );
          viewer.scene.primitives.add(tileset);
          statusEl.textContent = 'Google Photorealistic 3D Tiles active • ' + lat.toFixed(5) + ', ' + lng.toFixed(5);
        } else {
          statusEl.textContent = 'Standard 3D globe preview (configure GOOGLE_MAPS_API_KEY for Photorealistic 3D Tiles)';
        }

        viewer.entities.add({
          position: Cesium.Cartesian3.fromDegrees(lng, lat, 35),
          point: { pixelSize: 14, color: Cesium.Color.fromCssColorString('#ef4444'), outlineColor: Cesium.Color.WHITE, outlineWidth: 2 },
        });

        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(lng, lat - 0.0022, 220),
          orientation: {
            heading: Cesium.Math.toRadians(0.0),
            pitch: Cesium.Math.toRadians(-38.0),
            roll: 0.0,
          },
          duration: 1.8,
        });
      } catch (err) {
        statusEl.textContent = '3D view fallback: ' + (err && err.message ? err.message : String(err));
      }
    }
    window.initCrimeMaps3D = initCrimeMaps3D;
  </script>
</body>
</html>
